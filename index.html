
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>AURORA - 极光突围</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050814;color:#eef7ff;font-family:Arial,"Microsoft YaHei",sans-serif}
body{user-select:none}
#game{position:relative;width:100%;height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,#14213d 0%,#080e20 48%,#030611 100%)}
canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:absolute;top:0;left:0;width:100%;padding:18px 22px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.brand{font-size:13px;letter-spacing:5px;color:#8bdcff;font-weight:800;text-shadow:0 0 18px #28aaff}
.brand span{display:block;font-size:10px;letter-spacing:3px;color:#6e819e;margin-top:5px}
.stats{display:flex;gap:22px;text-align:right}
.stat-label{font-size:10px;letter-spacing:2px;color:#7e91ae}
.stat-value{font-size:22px;font-weight:800;margin-top:4px;text-shadow:0 0 16px #36bfff}
.health-wrap{position:absolute;left:22px;top:86px;width:180px;pointer-events:none}
.health-label{font-size:10px;letter-spacing:2px;color:#9aabc5;margin-bottom:8px}
.health-track{height:5px;border-radius:8px;background:#27334b;overflow:hidden}
#healthBar{height:100%;width:100%;background:linear-gradient(90deg,#27e5cf,#57aaff);box-shadow:0 0 15px #35dfff;transition:width .2s}
#wave{color:#b9a5ff}
#pause{position:absolute;right:22px;top:86px;border:1px solid #425879;background:#111d34;color:#cceaff;border-radius:9px;padding:9px 15px;font-size:12px;letter-spacing:1px;cursor:pointer}
#pause:hover{background:#1a3152}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(3,7,18,.58);backdrop-filter:blur(9px);transition:opacity .25s}
#overlay.hidden{opacity:0;pointer-events:none}
.panel{width:min(440px,90vw);padding:38px 30px;text-align:center;border:1px solid rgba(111,190,255,.25);border-radius:22px;background:linear-gradient(145deg,rgba(18,34,62,.94),rgba(7,13,29,.96));box-shadow:0 0 70px rgba(28,135,255,.14),inset 0 1px rgba(255,255,255,.08)}
.kicker{font-size:11px;letter-spacing:5px;color:#67d9ff}
h1{font-size:clamp(34px,8vw,58px);letter-spacing:5px;margin:13px 0 8px;background:linear-gradient(100deg,#fff,#7bdcff,#a69aff);background-clip:text;color:transparent}
#message{font-size:14px;line-height:1.8;color:#a9bbd5;margin:14px 0 25px}
#start{border:0;border-radius:10px;padding:14px 34px;color:#06101d;font-weight:900;letter-spacing:2px;font-size:13px;background:linear-gradient(100deg,#6deaff,#8d9dff);box-shadow:0 0 28px rgba(78,190,255,.3);cursor:pointer}
#start:active{transform:scale(.97)}
.hint{font-size:11px;color:#7286a4;margin-top:22px;line-height:1.8}
#mobileHint{display:none}
@media(max-width:650px){
 .hud{padding:14px}
 .stats{gap:12px}
 .stat-value{font-size:18px}
 .health-wrap{left:14px;top:75px;width:130px}
 #pause{right:14px;top:75px}
 .brand{font-size:11px;letter-spacing:3px}
 .brand span{font-size:9px}
 #mobileHint{display:block}
}
</style>
</head>
<body>
<div id="game">
  <canvas id="canvas"></canvas>

  <div class="hud">
    <div class="brand">AURORA <span>NEON SURVIVAL SYSTEM</span></div>
    <div class="stats">
      <div><div class="stat-label">SCORE</div><div class="stat-value" id="score">000000</div></div>
      <div><div class="stat-label">WAVE</div><div class="stat-value" id="wave">01</div></div>
      <div><div class="stat-label">COMBO</div><div class="stat-value" id="combo">×1</div></div>
    </div>
  </div>

  <div class="health-wrap">
    <div class="health-label">SHIELD INTEGRITY</div>
    <div class="health-track"><div id="healthBar"></div></div>
  </div>

  <button id="pause">Ⅱ 暂停</button>

  <div id="overlay">
    <div class="panel">
      <div class="kicker">DEEP SPACE / SECTOR 07</div>
      <h1>AURORA</h1>
      <div id="message">极光突围<br>驾驶飞船，抵御无人机群，挑战你的生存极限。</div>
      <button id="start">启动任务</button>
      <div class="hint">
        电脑：WASD 移动 · 鼠标瞄准 · 按住左键发射<br>
        <span id="mobileHint">手机：左侧拖动移动 · 右侧拖动瞄准并发射</span>
      </div>
    </div>
  </div>
</div>
<script src="./game.js"></script>
</body>
</html>
